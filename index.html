<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マルチプレイゲーム広場</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="portal.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="マルチプレイゲーム広場">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6d5843">
    <meta name="description" content="マルチプレイゲーム広場">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eshiritori.hansamubanana.workers.dev/">
    <meta property="og:title" content="マルチプレイゲーム広場">
    <meta property="og:description" content="マルチプレイゲーム広場">
    <meta property="og:image" content="https://eshiritori.hansamubanana.workers.dev/assets/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/pwa.css">
    <script type="module" src="/pwa.js"></script>
    <link rel="stylesheet" href="/lobby.css">
</head>
<body>
<main class="portal-container">
  <nav id="game-tabs" class="game-tabs" aria-label="ゲーム"></nav>
  <p id="game-description" class="game-description"></p>
  <div class="lobby-layout">
    <section id="table-grid" class="table-grid" aria-label="卓一覧"></section>
    <section class="lobby-chat" aria-label="ロビーチャット">
      <div class="chat-heading"><strong>ロビーチャット</strong><button id="friends-open" type="button">フレンド</button></div>
      <div id="lobby-messages" class="lobby-messages" aria-live="polite"></div>
      <form id="lobby-chat-form" class="chat-form"><input id="lobby-chat-input" aria-label="メッセージ" maxlength="1000" autocomplete="off"><button>送信</button></form>
    </section>
  </div>
</main>
<dialog id="profile-dialog"><form id="profile-form"><input id="profile-name-input" placeholder="名前を入力してください" aria-label="名前" maxlength="40" required><button id="register-profile-btn">登録</button></form></dialog>
<dialog id="friends-dialog"><div id="display-username"></div><button id="edit-profile-btn">名前を変える</button><button id="display-friendcode-badge"><span id="display-friendcode"></span></button><form id="friend-form"><input id="friend-code-input" placeholder="フレンドコードを追加" aria-label="フレンドコード"><button id="add-friend-btn">追加</button></form><div id="friends-list"></div><button id="friends-close">閉じる</button></dialog>
<dialog id="invite-modal"><p id="invite-modal-text"></p><button id="invite-accept-btn">参加する</button><button id="invite-decline-btn">ことわる</button></dialog>
</body>
</html>
