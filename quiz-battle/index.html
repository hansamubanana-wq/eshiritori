<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クイズバトル</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="クイズバトル">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#6d5843">
    <meta name="description" content="クイズバトル">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://eshiritori.hansamubanana.workers.dev/quiz-battle/">
    <meta property="og:title" content="クイズバトル">
    <meta property="og:description" content="クイズバトル">
    <meta property="og:image" content="https://eshiritori.hansamubanana.workers.dev/assets/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/pwa.css">
    <script type="module" src="/pwa.js"></script>
    <link rel="stylesheet" href="/table.css">
</head>
<body>
<div class="container">

    <!-- セットアップ画面 -->
    <div id="screen-lobby" class="screen active">
        <h2 id="lobby-room-title">部屋: --</h2>
        <button id="lobby-invite-btn" onclick="openLobbyInviteModal()" style="display:none;background-color:#3498db;border-color:#2980b9;padding:8px 16px;font-size:13px;margin-bottom:12px;">👥 フレンドを招待</button>

        <div class="lobby-list">
            <div style="font-weight:bold;border-bottom:2px dashed #9c826b;padding-bottom:5px;margin-bottom:10px;">参加中メンバー：</div>
            <div id="lobby-players-list"></div>
        </div>
        <button id="start-game-btn" hidden></button>
        <p id="wait-host-msg" style="font-size:14px;color:#7f8c8d;margin-top:10px;">※ホストがスタートボタンを押すと始まります。</p>

    </div>

    <!-- クイズ画面 -->
    <div id="screen-question" class="screen">
        <div class="quiz-header">
            <div class="quiz-progress">問題 <span id="q-num">1</span> / <span id="q-total">10</span></div>
            <div class="timer-circle" id="timer-circle">10</div>
        </div>
        <div class="quiz-layout">
            <div>
                <div class="question-card" id="question-text">問題文</div>
                <div class="choices-grid" id="choices-grid"></div>
                <div id="answer-reveal-area" style="display:none;" class="answer-reveal"></div>
                <button id="next-question-btn" onclick="hostNextQuestion()" style="display:none;background-color:#9b59b6;border-color:#8e44ad;margin-top:10px;width:100%;">次の問題へ ➔</button>
            </div>
            <div class="score-panel">
                <div class="score-title">📊 スコア</div>
                <div id="score-list"></div>
            </div>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" class="screen">
        <h2>🏆 最終結果！</h2>
        <div id="result-leaderboard" class="result-leaderboard"></div>
        <div style="margin-top:25px;text-align:center;">


        </div>
    </div>

</div>

<!-- フレンド招待モーダル -->
<div id="lobby-invite-modal" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);z-index:99999;justify-content:center;align-items:center;">
    <div style="background:#fffdf9;padding:25px;border-radius:16px;border:4px solid #6d5843;text-align:center;max-width:320px;width:90%;box-shadow:0 10px 25px rgba(0,0,0,0.25);">
        <h3 style="margin-top:0;border-bottom:2px dashed #9c826b;padding-bottom:6px;color:#5c4033;">👥 フレンドを招待</h3>
        <div id="lobby-invite-friends-list" style="max-height:220px;overflow-y:auto;margin:15px 0;text-align:left;display:flex;flex-direction:column;gap:8px;">
            <div style="color:#7f8c8d;font-size:12px;text-align:center;">読み込み中...</div>
        </div>
        <button onclick="document.getElementById('lobby-invite-modal').style.display='none'" style="background-color:#7f8c8d;border-bottom:4px solid #626d6e;padding:8px 16px;font-size:14px;width:100%;border-radius:20px;">閉じる</button>
    </div>
</div>

</body>
</html>
